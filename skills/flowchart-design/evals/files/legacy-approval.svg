<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500"
     role="img" aria-labelledby="title description">
  <title id="title">Legacy manifest delivery</title>
  <desc id="description">Fetch a manifest, import it, validate it, then publish or reject it.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a"
                    flood-opacity="0.16" />
    </filter>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef2ff" />
    </linearGradient>
  </defs>
  <rect width="1040" height="500" fill="url(#canvas)" />
  <g id="edges" fill="none" stroke="#475569" stroke-width="2"
     marker-end="url(#arrow)">
    <path d="M 210 235 H 350" />
    <path d="M 510 235 H 650" />
    <path d="M 810 218 C 855 180 875 150 900 130" />
    <path d="M 810 255 C 855 300 875 330 900 350" />
  </g>
  <g id="edge-labels" fill="#334155" font-family="sans-serif" font-size="16">
    <text x="850" y="160">유효</text>
    <text x="850" y="325">거부</text>
  </g>
  <g id="old-delivery" aria-label="Old Delivery">
    <rect x="330" y="135" width="200" height="200" rx="24" fill="#e0e7ff"
          stroke="#818cf8" stroke-dasharray="7 5" />
    <text x="430" y="160" text-anchor="middle" font-family="sans-serif"
          font-size="15">Old Delivery</text>
    <g id="legacy-import" class="node" filter="url(#shadow)">
      <rect x="350" y="190" width="160" height="90" rx="18" fill="#fff"
            stroke="#94a3b8" />
      <text x="430" y="225" text-anchor="middle" font-family="sans-serif"
            font-size="18">Legacy Import</text>
      <text x="430" y="250" text-anchor="middle" font-family="monospace"
            font-size="12">legacy/manifest-v1</text>
    </g>
  </g>
  <g id="fetch" class="node" filter="url(#shadow)">
    <rect x="50" y="190" width="160" height="90" rx="18" fill="#fff"
          stroke="#94a3b8" />
    <text x="130" y="224" text-anchor="middle" font-family="sans-serif"
          font-size="18">Fetch manifest</text>
    <text x="130" y="249" text-anchor="middle" font-family="monospace"
          font-size="11">tenant-configuration/control-plane/api/v2/manifest.yaml</text>
  </g>
  <g id="validate" class="node" filter="url(#shadow)">
    <rect x="650" y="190" width="160" height="90" rx="18" fill="#fff"
          stroke="#94a3b8" />
    <text x="730" y="224" text-anchor="middle" font-family="sans-serif"
          font-size="18">Validate</text>
    <text x="730" y="249" text-anchor="middle" font-family="sans-serif"
          font-size="13">필수 필드와 서명 확인</text>
  </g>
  <g id="publish" class="node" filter="url(#shadow)">
    <rect x="900" y="90" width="120" height="80" rx="18" fill="#fff"
          stroke="#94a3b8" />
    <text x="960" y="137" text-anchor="middle" font-family="sans-serif"
          font-size="17">Publish</text>
  </g>
  <g id="reject" class="node" filter="url(#shadow)">
    <rect x="900" y="310" width="120" height="80" rx="18" fill="#fff"
          stroke="#94a3b8" />
    <text x="960" y="357" text-anchor="middle" font-family="sans-serif"
          font-size="17">Rejected</text>
  </g>
</svg>
