name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate every SKILL.md
        run: |
          set -euo pipefail
          for skill in skills/*/ standalone-skills/*/; do
            echo "== ${skill}"
            python skills/skill-builder/scripts/quick_validate.py "${skill}"
          done

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Node tests
        run: |
          set -euo pipefail
          files=$(find skills -path '*/tests/*.mjs' -type f | sort)
          if [ -n "${files}" ]; then
            # shellcheck disable=SC2086
            node --test ${files}
          else
            echo "no .mjs tests"
          fi
