name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate every SKILL.md
        run: |
          set -euo pipefail
          for skill in skills/*/; do
            echo "== ${skill}"
            python skills/skill-builder/scripts/quick_validate.py "${skill}"
          done

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Node tests
        run: |
          set -euo pipefail
          files=$(find skills -path '*/tests/*.mjs' -type f | sort)
          if [ -n "${files}" ]; then
            node --test ${files}
          else
            echo "no .mjs tests"
          fi

      - name: Install Claude Code CLI
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.292
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test Claude Code mod
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          set -euo pipefail
          claude --version
          claude plugin test .
