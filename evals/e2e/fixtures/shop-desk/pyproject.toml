[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-desk"
version = "0.4.0"
description = "Order desk for a small shop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shop = "shop.cli:main"

[tool.setuptools.packages.find]
include = ["shop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
