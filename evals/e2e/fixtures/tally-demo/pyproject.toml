[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-demo"
version = "0.1.0"
description = "Small note statistics library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["tally*", "queues*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
