[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orders-svc"
version = "0.4.0"
description = "A small order service with a command line"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["orders*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
