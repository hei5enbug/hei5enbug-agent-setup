[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-cli"
version = "0.3.1"
description = "Command-line memo manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
notes-cli = "notes_cli.cli:main"

[tool.setuptools.packages.find]
include = ["notes_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
