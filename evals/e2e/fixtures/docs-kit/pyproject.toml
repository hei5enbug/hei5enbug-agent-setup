[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-kit"
version = "0.4.0"
description = "Static documentation site builder with a local visit database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dockit = "dockit.cli:main"

[tool.setuptools.packages.find]
include = ["dockit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
