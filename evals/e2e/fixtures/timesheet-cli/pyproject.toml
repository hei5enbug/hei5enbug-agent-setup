[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timesheet-cli"
version = "0.2.0"
description = "Command-line time entry tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
timesheet = "timesheet.cli:main"

[tool.setuptools.packages.find]
include = ["timesheet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
