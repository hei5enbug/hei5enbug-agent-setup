[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-lite"
version = "0.2.0"
description = "Cart pricing library with a small command line"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["shop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
