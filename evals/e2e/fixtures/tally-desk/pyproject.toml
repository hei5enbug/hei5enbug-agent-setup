[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-desk"
version = "0.3.0"
description = "Hours per team"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tally = "tally.cli:main"

[tool.setuptools.packages.find]
include = ["tally*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
