[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-host"
version = "1.3.0"
description = "Session context and options of a fictional plugin host"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["host*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
